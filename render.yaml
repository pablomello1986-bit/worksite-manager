services:
  - type: web
    name: worksitemanager
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
    disk:
      name: worksite-data
      mountPath: /data
      sizeGB: 1
